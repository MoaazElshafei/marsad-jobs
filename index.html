<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مرصد الوظائف | MarsadJobs - وظائف مصر والوطن العربي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- استدعاء خطوط بوزن 300 الخفيف وخط Mono للأكواد والبيانات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-forest-depths: #1c3a13;
      --color-lime-pulse: #d3fa99;
      --color-sage-moss: #757c5d;
      --color-olive-gold: #9f995b;
      --color-eucalyptus: #698e79;
      --color-snow-white: #fcfcf7;
      --color-warm-stone: #eeeee9;
      --color-frosted-glass: #c4c7c4;
      --color-ash: #b3b3b3;
      --color-pewter: #666666;
      --color-ink: #000000;
    }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background-color: var(--color-snow-white);
      color: var(--color-forest-depths);
      font-weight: 400;
      margin: 0;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.015em;
    }

    /* Whisper-light display typography */
    .seed-display {
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.4px;
    }

    .seed-subheading {
      font-weight: 300;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    /* Custom placeholder for dark section inputs */
    .seed-input::placeholder {
      color: rgba(252, 252, 247, 0.55);
    }

    /* إخفاء شريط التمرير مع الحفاظ على وظيفته */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Promo Banner (شريط الإعلانات العلوي النحيف) -->
  <div class="w-full h-[40px] bg-[#fcfcf7] text-[#1c3a13] border-b border-[#eeeee9] flex items-center justify-center px-4 text-[12px] font-medium uppercase tracking-wide">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-[#1c3a13] inline-block"></span>
      <span>رصد آلي لحظي لوظائف مصر على مدار الساعة — يعمل دون وسطاء</span>
    </div>
  </div>

  <!-- Navigation Bar (شريط التنقل الرئيسي) -->
  <header class="bg-[#fcfcf7] text-[#1c3a13] sticky top-0 z-30 border-b border-[#eeeee9] h-[72px] flex items-center">
    <div class="max-w-[1200px] w-full mx-auto px-6 flex items-center justify-between">
      
      <!-- الشعار + النقطة الخضراء المميزة -->
      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center gap-1.5 text-[24px] font-normal tracking-tight text-[#1c3a13]">
          <span>مرصد</span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#1c3a13] inline-block"></span>
          <span class="font-mono-code text-[12px] border-[1.5px] border-[#1c3a13] rounded-[1000px] px-2 py-0.5 mr-1">MJ-01®</span>
        </a>
      </div>

      <!-- الأزرار التفاعلية (Ghost / Inverted & Primary Filled) -->
      <div class="flex items-center gap-2">
        <div id="country-buttons" class="flex items-center">
          <button onclick="selectCountry('EG')" data-country="EG" class="bg-[#fcfcf7] text-[#1c3a13] border-[1.5px] border-[#1c3a13] rounded-[1000px] px-5 py-2 text-[14px] font-normal flex items-center gap-1.5 transition hover:bg-[#eeeee9]">
            <span>🇪🇬</span><span>مصر</span>
          </button>
        </div>

        <a href="admin.html" class="bg-[#1c3a13] text-[#fcfcf7] rounded-[1000px] px-6 py-2.5 text-[14px] font-normal transition hover:opacity-90">
          لوحة التحكم
        </a>
      </div>

    </div>
