<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مرصد الوظائف | MarsadJobs - وظائف مصر والوطن العربي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-purple-50/40 text-slate-900 min-h-screen flex flex-col">

  <!-- الهيدر وشريط التنقل -->
  <header class="bg-purple-950 text-white border-b border-purple-900 sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="bg-fuchsia-600 text-white font-black px-3.5 py-1.5 rounded-xl text-xl shadow">
          مرصد
        </span>
        <div>
          <h1 class="text-xl font-bold tracking-wide">مرصد الوظائف | MarsadJobs</h1>
          <p class="text-xs text-purple-200">رصد آلي لحظي لوظائف مصر على مدار الساعة</p>
        </div>
      </div>

      <!-- زر لوحة التحكم السريع والدول -->
      <div class="flex items-center gap-3">
        <a href="admin.html" class="bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs transition shadow flex items-center gap-1">
          ⚙️ لوحة التحكم
        </a>
        <div class="flex items-center gap-2 overflow-x-auto" id="country-buttons">
          <button onclick="selectCountry('EG')" data-country="EG" class="country-btn bg-fuchsia-600 text-white font-bold px-3.5 py-1.5 rounded-full text-sm flex items-center gap-1.5 shadow transition">
            <span>🇪🇬</span><span>مصر</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- قسم البحث الرئيسي -->
  <section class="bg-gradient-to-b from-purple-950 to-purple-900 text-white py-12 px-4 shadow-inner">
    <div class="max-w-4xl mx-auto text-center space-y-5">
      <div class="inline-flex items-center gap-2 bg-fuchsia-500/10 border border-fuchsia-500/30 text-fuchsia-300 px-3 py-1 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-fuchsia-400 animate-ping"></span>
        يعمل بالرصد التلقائي الذكي دون وسطاء
      </div>
      <h2 class="text-2xl md:text-4xl font-extrabold leading-relaxed">
        ابحث عن فرصة عملك في مصر في <span class="text-fuchsia-300">ثوانٍ معدودة</span>
      </h2>
      <p class="text-purple-200 text-sm md:text-base max-w-2xl mx-auto">
        يجمع مرصد لك أحدث الفرص الوظيفية المتاحة في السوق المصري ويصنفها لك تلقائياً
      </p>

      <!-- شريط البحث والفلاتر -->
      <div class="bg-white p-2 rounded-2xl shadow-xl flex flex-col md:flex-row gap-2 max-w-3xl mx-auto mt-6">
        <input
          id="search-input"
          type="text"
          oninput="filterJobs()"
          placeholder="ابحث بالمسمى الوظيفي، التخصص، اسم الشركة، أو المدينة..."
          class="flex-1 px-4 py-3 text-slate-800 rounded-xl focus:outline-none text-sm md:text-base"
        />
        <select
          id="type-filter"
          onchange="filterJobs()"
          class="bg-purple-50 text-purple-900 px-4 py-3 rounded-xl font-semibold text-sm focus
